<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e5482d"><meta name="description" content="喝了么：一个贼牛逼的鸡尾酒记录工具。">
  <meta name="referrer" content="no-referrer">
  <title>喝了么</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23e5482d'/%3E%3Cpath d='M12 13h24L24 26zM24 26v10m-8 0h16' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./core.js"></script><script defer src="./seed.js"></script><script defer src="./hierarchy.js"></script><script defer src="./materials.js"></script><script defer src="./app.js"></script>
</head>
<body>
  <div id="app"><div class="boot">正在打开喝了么…</div></div>
  <dialog id="detail-dialog" class="detail-dialog" aria-label="配方详情"></dialog>
  <dialog id="editor-dialog" class="editor-dialog" aria-label="编辑配方"></dialog>
  <dialog id="item-dialog" class="editor-dialog item-dialog" aria-label="编辑材料"></dialog>
  <dialog id="material-dialog" class="editor-dialog material-dialog" aria-label="选择材料"></dialog>
  <dialog id="sync-dialog" class="editor-dialog sync-dialog" aria-label="GitHub 同步设置"></dialog>
  <dialog id="admin-dialog" class="editor-dialog admin-dialog" aria-label="管理员页面"></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-label="确认操作"></dialog>
  <div id="sync-overlay" class="sync-overlay" role="status" aria-live="polite" aria-hidden="true" hidden>
    <div class="sync-overlay-card" data-sync-state="loading">
      <span class="sync-indicator sync-spinner" aria-hidden="true"></span>
      <strong id="sync-overlay-title">正在同步中</strong>
      <span id="sync-overlay-message">正在与 GitHub 同步数据，请稍候…</span>
      <div class="sync-overlay-actions" hidden>
        <button class="btn" data-action="cancel-sync-result">取消</button>
        <button class="btn primary" data-action="retry-sync">再次同步</button>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 后使用配方记录与筛选。</noscript>
</body>
</html>
